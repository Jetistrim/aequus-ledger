name: Security Scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  trivy-images:
    runs-on: ubuntu-latest
    needs: trivy-fs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production images
        run: docker compose --profile prod build backend-prod frontend-prod

      - name: Run Trivy on backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: conciliaofinanceira-backend-prod:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Run Trivy on frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: conciliaofinanceira-frontend-prod:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
