services:
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conciliacao-backend-dev
    restart: unless-stopped
    init: true
    profiles: ["dev"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: file:/app/data/db.sqlite
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
      MAX_FILE_SIZE_MB: 10
      EXPORTS_DIR: ./exports
      UPLOADS_DIR: ./uploads
    ports:
      - "3001:3001"
    volumes:
      - backend_data:/app/data
      - backend_exports:/app/exports
      - backend_uploads:/app/uploads
    networks:
      default:
        aliases:
          - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: ${HC_INTERVAL_DEV:-10s}
      timeout: ${HC_TIMEOUT_DEV:-5s}
      retries: ${HC_RETRIES_DEV:-12}
      start_period: ${HC_START_PERIOD_DEV:-15s}

  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conciliacao-backend-prod
    restart: unless-stopped
    init: true
    profiles: ["prod"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: file:/app/data/db.sqlite
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      MAX_FILE_SIZE_MB: 10
      EXPORTS_DIR: ./exports
      UPLOADS_DIR: ./uploads
    volumes:
      - backend_data:/app/data
      - backend_exports:/app/exports
      - backend_uploads:/app/uploads
    networks:
      default:
        aliases:
          - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: ${HC_INTERVAL_PROD:-15s}
      timeout: ${HC_TIMEOUT_PROD:-7s}
      retries: ${HC_RETRIES_PROD:-12}
      start_period: ${HC_START_PERIOD_PROD:-20s}

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conciliacao-frontend-dev
    restart: unless-stopped
    init: true
    profiles: ["dev"]
    depends_on:
      backend-dev:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp
    environment:
      VITE_API_PROXY_TARGET: http://backend:3001
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: conciliacao-frontend-prod
    restart: unless-stopped
    init: true
    profiles: ["prod"]
    depends_on:
      backend-prod:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./frontend/certs:/certs:ro
    ports:
      - "5173:8443"
    healthcheck:
      test: ["CMD", "node", "-e", "process.env.NODE_TLS_REJECT_UNAUTHORIZED='0'; fetch('https://127.0.0.1:8443/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: ${HC_INTERVAL_PROD:-15s}
      timeout: ${HC_TIMEOUT_PROD:-7s}
      retries: ${HC_RETRIES_PROD:-12}
      start_period: ${HC_START_PERIOD_PROD:-20s}

volumes:
  backend_data:
  backend_exports:
  backend_uploads:
